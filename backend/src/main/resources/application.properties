spring.application.name=sgc-proveperu-backend

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:sgc_proveperu}
spring.datasource.username=${POSTGRES_USER:proveperu_app}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Consulta de DNI/RUC. El token se usa únicamente desde el backend.
# La consulta externa de DNI requiere autorización del proveedor y queda deshabilitada por defecto.
app.consulta-documento.enabled=${DOCUMENT_LOOKUP_ENABLED:false}
app.consulta-documento.dni-enabled=${DOCUMENT_LOOKUP_DNI_ENABLED:false}
app.consulta-documento.base-url=${DOCUMENT_LOOKUP_BASE_URL:https://api.decolecta.com/v1}
app.consulta-documento.token=${DOCUMENT_LOOKUP_TOKEN:}
app.consulta-documento.connect-timeout=${DOCUMENT_LOOKUP_CONNECT_TIMEOUT:PT5S}
app.consulta-documento.read-timeout=${DOCUMENT_LOOKUP_READ_TIMEOUT:PT10S}
app.consulta-documento.cache-ttl=${DOCUMENT_LOOKUP_CACHE_TTL:PT24H}
app.consulta-documento.negative-cache-ttl=${DOCUMENT_LOOKUP_NEGATIVE_CACHE_TTL:PT5M}
app.consulta-documento.cache-max-entries=${DOCUMENT_LOOKUP_CACHE_MAX_ENTRIES:5000}
app.consulta-documento.rate-limit-requests=${DOCUMENT_LOOKUP_RATE_LIMIT_REQUESTS:10}
app.consulta-documento.rate-limit-window=${DOCUMENT_LOOKUP_RATE_LIMIT_WINDOW:PT1M}
app.consulta-documento.rate-limit-max-users=${DOCUMENT_LOOKUP_RATE_LIMIT_MAX_USERS:10000}
app.consulta-documento.retry-max-attempts=${DOCUMENT_LOOKUP_RETRY_MAX_ATTEMPTS:3}
app.consulta-documento.retry-delay=${DOCUMENT_LOOKUP_RETRY_DELAY:PT0.25S}
app.consulta-documento.circuit-breaker-failures=${DOCUMENT_LOOKUP_CIRCUIT_FAILURES:5}
app.consulta-documento.circuit-breaker-open-duration=${DOCUMENT_LOOKUP_CIRCUIT_OPEN_DURATION:PT30S}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.version=OPENAPI_3_0

app.bootstrap.admin.enabled=${ADMIN_INITIAL_ENABLED:false}
app.bootstrap.admin.reset-password=${ADMIN_INITIAL_RESET_PASSWORD:false}
app.bootstrap.admin.login=${ADMIN_INITIAL_LOGIN:}
app.bootstrap.admin.password=${ADMIN_INITIAL_PASSWORD:}
app.bootstrap.admin.nombre-completo=${ADMIN_INITIAL_NAME:Administrador del sistema}

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:sgc-proveperu}
app.security.jwt.expiration=${JWT_EXPIRATION:PT2H}

# Facturación electrónica SUNAT. Permanece deshabilitada hasta configurar
# localmente un certificado PKCS#12 y credenciales de pruebas.
app.sunat.enabled=${SUNAT_ENABLED:false}
app.sunat.production-enabled=${SUNAT_PRODUCTION_ENABLED:false}
app.sunat.ambiente=${SUNAT_AMBIENTE:BETA}
app.sunat.usuario-sol=${SUNAT_SOL_USER:MODDATOS}
app.sunat.clave-sol=${SUNAT_SOL_PASSWORD:MODDATOS}
app.sunat.certificado-ruta=${SUNAT_CERTIFICATE_PATH:}
app.sunat.certificado-clave=${SUNAT_CERTIFICATE_PASSWORD:}
app.sunat.endpoint-beta=${SUNAT_BETA_ENDPOINT:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
app.sunat.endpoint-produccion=${SUNAT_PRODUCTION_ENDPOINT:https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService}
app.sunat.connect-timeout=${SUNAT_CONNECT_TIMEOUT:PT15S}
app.sunat.read-timeout=${SUNAT_READ_TIMEOUT:PT45S}
app.sunat.resumen-diario-automatico-enabled=${SUNAT_DAILY_SUMMARY_AUTO_ENABLED:false}
app.sunat.resumen-diario-auto-enviar=${SUNAT_DAILY_SUMMARY_AUTO_SEND:false}
app.sunat.resumen-diario-cron=${SUNAT_DAILY_SUMMARY_CRON:0 15 2 * * *}
