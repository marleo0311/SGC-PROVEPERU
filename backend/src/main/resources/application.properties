spring.application.name=sgc-proveperu-backend

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:sgc_proveperu}
spring.datasource.username=${POSTGRES_USER:proveperu_app}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.version=OPENAPI_3_0

app.bootstrap.admin.enabled=${ADMIN_INITIAL_ENABLED:false}
app.bootstrap.admin.reset-password=${ADMIN_INITIAL_RESET_PASSWORD:false}
app.bootstrap.admin.login=${ADMIN_INITIAL_LOGIN:}
app.bootstrap.admin.password=${ADMIN_INITIAL_PASSWORD:}
app.bootstrap.admin.nombre-completo=${ADMIN_INITIAL_NAME:Administrador del sistema}

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:sgc-proveperu}
app.security.jwt.expiration=${JWT_EXPIRATION:PT2H}

# Facturación electrónica SUNAT. Permanece deshabilitada hasta configurar
# localmente un certificado PKCS#12 y credenciales de pruebas.
app.sunat.enabled=${SUNAT_ENABLED:false}
app.sunat.production-enabled=${SUNAT_PRODUCTION_ENABLED:false}
app.sunat.ambiente=${SUNAT_AMBIENTE:BETA}
app.sunat.usuario-sol=${SUNAT_SOL_USER:MODDATOS}
app.sunat.clave-sol=${SUNAT_SOL_PASSWORD:MODDATOS}
app.sunat.certificado-ruta=${SUNAT_CERTIFICATE_PATH:}
app.sunat.certificado-clave=${SUNAT_CERTIFICATE_PASSWORD:}
app.sunat.endpoint-beta=${SUNAT_BETA_ENDPOINT:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
app.sunat.endpoint-produccion=${SUNAT_PRODUCTION_ENDPOINT:https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService}
app.sunat.connect-timeout=${SUNAT_CONNECT_TIMEOUT:PT15S}
app.sunat.read-timeout=${SUNAT_READ_TIMEOUT:PT45S}
