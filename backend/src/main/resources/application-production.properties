# Perfil utilizado únicamente dentro de docker-compose.production.yml.
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

server.address=0.0.0.0
server.port=8080
server.forward-headers-strategy=framework
server.shutdown=graceful
server.compression.enabled=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.lifecycle.timeout-per-shutdown-phase=30s

# La documentación interactiva se mantiene disponible solo en desarrollo.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# En producción solo se publica el control mínimo usado por Docker.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
